<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>すーぱーゆゆっぴ</title>
  <meta name="description" content="ゆゆっぴのファンサイトだよ！">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fff; font-family: sans-serif; }
    #v-app { text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  
  <!-- 解析されても意味不明な汎用入力フォーム -->
  <div id="v-app">
    <p style="font-size: 14px; color: #333; margin-bottom: 10px;">あなたのキーを入力してください</p>
    <input type="password" id="v-inp">
    <button id="v-btn">OK</button>
  </div>

  <!-- データ流し込み用の空箱 -->
  <div id="v-main" class="hidden"></div>

  <script>
    document.getElementById('v-btn').addEventListener('click', async () => {
      const val = document.getElementById('v-inp').value;
      if (!val) return;

      // 🌟 ここでSupabaseにアクセスする処理（今はダミー）
      const isSuccess = true; 
      const serverData = "<h2>秘密部屋🤫</h2><div style='height:400px;border:1px solid #ccc;'></div><input type='text'><button>送信</button>"; 

      if (isSuccess) {
        document.getElementById('v-app').classList.add('hidden');
        document.body.style.display = 'block';
        document.body.style.backgroundColor = '#f0f0f0';
        document.body.style.padding = '20px';
        
        const main = document.getElementById('v-main');
        main.classList.remove('hidden');
        main.innerHTML = serverData; 
      }
    });
  </script>

</body>
</html>
