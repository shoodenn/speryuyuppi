<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404 Not Found</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      margin: 0; padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #2c2c2c; 
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; height: 100dvh; overflow: hidden; 
    }
    
    #dummy-screen, #chat-app { 
      width: 100%; max-width: 480px; 
      height: 100%; background-color: #fff; 
      position: relative; overflow: hidden; 
      box-shadow: 0 0 30px rgba(0,0,0,0.8); 
    }

    #dummy-screen { padding: 50px 20px; box-sizing: border-box; text-align: center; z-index: 10; display: block; }
    #dummy-screen h1 { font-size: 24px; margin-bottom: 10px; color: #000; }
    #dummy-screen p { font-size: 14px; color: #666; }
    
    #secret-input { 
      position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; 
      border: none; background: transparent; color: transparent; outline: none; 
      caret-color: transparent; font-size: 16px; text-align: center; transition: 0.3s; 
    }
    #secret-input:focus {
      color: #aaa; 
      caret-color: #aaa; 
      background-color: #fafafa; 
      border-top: 1px dashed #eee; 
    }

    #chat-app { display: none; flex-direction: column; background-color: #f7f9fc; z-index: 20; }
    
    #lock-screen-overlay { 
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background-color: #fff; z-index: 9999; justify-content: center; align-items: center; 
      font-size: 24px; color: #555; font-weight: bold; flex-direction: column; 
    }
    #request-unlock-btn {
      margin-top: 25px; padding: 12px 24px; font-size: 16px; border-radius: 25px; border: none; 
      background-color: #f06595; color: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: 0.2s;
    }
    #request-unlock-btn:active { transform: scale(0.95); }
    
    #header { display: none; justify-content: space-between; align-items: center; padding: max(12px, env(safe-area-inset-top)) 15px 12px; background-color: #fff; border-bottom: 1px solid #ddd; font-weight: bold; }
    #lock-btn { padding: 6px 12px; border: none; border-radius: 15px; cursor: pointer; font-size: 14px; background-color: #f1f3f5; transition: 0.2s; }
    
    #chat-box { flex: 1; overflow-y: auto; padding: max(15px, env(safe-area-inset-top)) 15px 15px; display: flex; flex-direction: column; gap: 12px; }
    .message-wrapper { display: flex; align-items: flex-end; width: 100%; }
    .my-wrapper { justify-content: flex-end; }
    .their-wrapper { justify-content: flex-start; }
    .delete-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: 0.5; padding: 5px 8px; margin-bottom: 5px; }
    .delete-btn:hover { opacity: 1; }
    .bubble { max-width: 75%; padding: 10px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
    .bubble img, .bubble video, .bubble audio { max-width: 100%; border-radius: 10px; margin-top: 5px; outline: none; }
    .bubble a { color: #0066cc; text-decoration: underline; font-weight: bold; word-break: break-all; }
    
    .chat-mode-shoden .my-message { background-color: #d0ebff; border-bottom-right-radius: 3px; color: #333; }
    .chat-mode-shoden .their-message { background-color: #fce4ec; border-bottom-left-radius: 3px; color: #333; }
    .chat-mode-juwaden .my-message { background-color: #fce4ec; border-bottom-right-radius: 3px; color: #333; }
    .chat-mode-juwaden .their-message { background-color: #d0ebff; border-bottom-left-radius: 3px; color: #333; }
    .system-message { background-color: #e9ecef; border-bottom-right-radius: 3px; color: #495057; font-size: 13px; font-weight: bold; border: 1px dashed #ced4da; }
    
    #input-area { display: flex; align-items: flex-end; padding: 10px 10px max(10px, env(safe-area-inset-bottom)); background-color: #fff; border-top: 1px solid #ddd; gap: 8px; }
    #file-label { background-color: #f1f3f5; padding: 10px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: background-color 0.2s; }
    #file-input { display: none; }
    #message-input { flex: 1; resize: none; border: 1px solid #ccc; border-radius: 18px; padding: 10px 15px; font-size: 15px; max-height: 100px; outline: none; }
    #send-btn { color: white; border: none; border-radius: 18px; padding: 10px 15px; font-size: 15px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    .chat-mode-shoden #send-btn { background-color: #4dabf7; }
    .chat-mode-juwaden #send-btn { background-color: #f06595; }
  </style>
</head>
<body>
  <div id="dummy-screen">
    <h1>404 Not Found</h1>
    <p>The requested URL was not found on this server.</p>
    <input type="text" id="secret-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>

  <div id="chat-app">
    <div id="lock-screen-overlay">
      <div style="text-align: center;">
        <div>今は使えないよ💦</div>
        <button id="request-unlock-btn">🔓 ロック解除を申請する</button>
      </div>
    </div>
    
    <div id="header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span>俺</span>
        <span id="online-status" style="font-size: 11px; padding: 3px 8px; border-radius: 12px; background-color: #adb5bd; color: white; display: none; font-weight: normal;">⚪️ オフライン</span>
      </div>
      <button id="lock-btn">🔓 ロックしてない</button>
    </div>
    <div id="chat-box"></div>
    <div id="input-area">
      <label id="file-label">📁<input type="file" id="file-input"></label>
      <textarea id="message-input" rows="1" placeholder="メッセージを入力..."></textarea>
      <button id="send-btn">送信</button>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://vxlhivwuyfsjlydbjhfz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4bGhpdnd1eWZzamx5ZGJqaGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDE5NDYsImV4cCI6MjEwODUxNzk0Nn0.9_hBOLttjOlM1xaZlQmekR1Tt5_zEYQL1ltuMozCAS8';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    
    let MY_NAME = '';
    let currentMode = '';
    let isLocked = false;
    let isAppInitialized = false;
    let presenceChannel;

    const dummyScreen = document.getElementById('dummy-screen');
    const secretInput = document.getElementById('secret-input');
    const chatApp = document.getElementById('chat-app');
    const lockScreenOverlay = document.getElementById('lock-screen-overlay');
    const requestUnlockBtn = document.getElementById('request-unlock-btn');
    const header = document.getElementById('header');
    const lockBtn = document.getElementById('lock-btn');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const fileInput = document.getElementById('file-input');
    const sendBtn = document.getElementById('send-btn');
    const fileLabel = document.getElementById('file-label');
    const onlineStatus = document.getElementById('online-status');

    const _0x4a9b = [
      "%E3%81%82%E3%81%84%E3%81%86%E3%81%88%E3%81%8A", 
      "%E3%81%82%E3%82%80%E3%82%8D%E3%81%A8%E3%82%8B%E3%81%86%E3%81%8F%E3%81%A8%E3%81%B5%E3%82%8B%E3%81%B1%E3%82%8F%E3%83%BC%E3%82%8A%E3%81%A3%E3%81%8F", 
      "%E3%81%8B%E3%81%8D%E3%81%8F%E3%81%91%E3%81%93", 
      "%E3%81%95%E3%81%97%E3%81%99%E3%81%9B%E3%81%9D", 
      "%E3%81%82%E3%82%80%E3%82%8D%E3%81%A8%E3%81%97%E3%82%87%E3%83%BC%E3%81%A7%E3%82%93", 
      "%E3%81%9F%E3%81%A1%E3%81%A4%E3%81%A6%E3%81%A8"  
    ];

    secretInput.addEventListener('input', (e) => {
      const val = e.target.value.trim(); 
      const _0x1c = encodeURIComponent(val);
      
      if (_0x1c === _0x4a9b[4]) { 
        startChat('shoden'); e.target.value = ''; 
      } else if (_0x1c === _0x4a9b[1]) { 
        startChat('juwaden'); e.target.value = ''; 
      }
    });

    function startChat(mode) {
      currentMode = mode; MY_NAME = mode;
      dummyScreen.style.display = 'none';
      chatApp.style.display = 'flex';
      chatApp.classList.add('chat-mode-' + mode);
      document.title = mode === 'shoden' ? '俺' : 'ゆゆっぴ';
      header.style.display = mode === 'shoden' ? 'flex' : 'none';
      
      if (mode === 'shoden') {
        onlineStatus.style.display = 'inline-block';
      }

      if (!isAppInitialized) { 
        initApp(); 
        setupPresence(); 
        isAppInitialized = true; 
      }
      
      resetActivityTimers();
    }

    function initApp() {
      initLockState();
      supabaseClient.channel('public:settings')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'settings' }, payload => {
          isLocked = payload.new.is_locked; applyLockState();
        }).subscribe();

      loadMessages();
      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          appendMessage(payload.new.id, payload.new.sender, payload.new.content, payload.new.file_url, payload.new.file_type);
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
          const bubble = document.getElementById(`msg-${payload.new.id}` || `msg-${payload.old.id}`); if (bubble) bubble.remove();
        }).subscribe();
    }
    
    function setupPresence() {
      presenceChannel = supabaseClient.channel('online-users');
      
      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const newState = presenceChannel.presenceState();
          let isJuwadenOnline = false;
          
          for (const key in newState) {
            newState[key].forEach(p => {
              if (p.user_name === 'juwaden') isJuwadenOnline = true;
            });
          }
          
          if (MY_NAME === 'shoden') {
            if (isJuwadenOnline) {
              onlineStatus.textContent = '🟢 オンライン';
              onlineStatus.style.backgroundColor = '#40c057';
            } else {
              onlineStatus.textContent = '⚪️ オフライン';
              onlineStatus.style.backgroundColor = '#adb5bd';
            }
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({ user_name: MY_NAME });
            
            // 相手(juwaden)がオンラインになった瞬間に、俺(shoden)向けに履歴を残す
            if (MY_NAME === 'juwaden') {
              const now = new Date();
              const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
              const historyText = `🟢 相手がオンラインになりました (${timeStr})`;
              
              await supabaseClient.from('messages').insert([{ 
                sender: 'system_online_history', content: historyText, file_url: null, file_type: null 
              }]);
            }
          }
        });
    }

    async function initLockState() {
      const { data } = await supabaseClient.from('settings').select('is_locked').eq('id', 1).single();
      if (data) { isLocked = data.is_locked; applyLockState(); }
    }

    function applyLockState() {
      if (currentMode === 'shoden') {
        lockBtn.textContent = isLocked ? '🔒 ロック中' : '🔓 ロックしてない';
        lockBtn.style.backgroundColor = isLocked ? '#ffc9c9' : '#f1f3f5';
        lockBtn.style.color = isLocked ? '#e03131' : '#333';
      } else if (currentMode === 'juwaden') {
        lockScreenOverlay.style.display = isLocked ? 'flex' : 'none';
      }
    }

    requestUnlockBtn.addEventListener('click', async () => {
      requestUnlockBtn.disabled = true;
      const originalText = requestUnlockBtn.textContent;
      requestUnlockBtn.textContent = '申請中...';
      
      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      const text = `ロック解除の申請 ${timeStr}`;
      
      const { error } = await supabaseClient.from('messages').insert([{ 
        sender: MY_NAME, content: text, file_url: null, file_type: null 
      }]);
      
      if (!error) {
        requestUnlockBtn.textContent = '申請を送信したよ！';
        setTimeout(() => { requestUnlockBtn.disabled = false; requestUnlockBtn.textContent = originalText; }, 60000);
      } else {
        alert('エラー💦: ' + error.message);
        requestUnlockBtn.disabled = false; requestUnlockBtn.textContent = originalText;
      }
    });

    let autoLockTimer;
    let dummyRedirectTimer;
    
    function enforceAutoLock() {
      if (MY_NAME === 'shoden' && !isLocked) {
        supabaseClient.rpc('toggle_lock', { new_state: true });
      }
    }

    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 15 && now.getMinutes() === 0 && now.getSeconds() < 10) {
        enforceAutoLock();
      }
    }, 10000);

    function resetActivityTimers() {
      if (!isAppInitialized) return;

      clearTimeout(autoLockTimer);
      const h = new Date().getHours();
      if (h >= 15 || h < 3) {
        autoLockTimer = setTimeout(enforceAutoLock, 5 * 60 * 1000); 
      }

      clearTimeout(dummyRedirectTimer);
      dummyRedirectTimer = setTimeout(() => {
        window.location.reload(); 
      }, 10 * 60 * 1000); 
    }
    
    document.addEventListener('click', resetActivityTimers);
    document.addEventListener('input', resetActivityTimers);
    document.addEventListener('touchstart', resetActivityTimers);
    document.addEventListener('mousemove', resetActivityTimers);
    document.addEventListener('scroll', resetActivityTimers);

    lockBtn.addEventListener('click', async () => {
      const { error } = await supabaseClient.rpc('toggle_lock', { new_state: !isLocked });
      if (error) alert('ロック変更エラー💦: ' + error.message);
      resetActivityTimers();
    });

    function appendMessage(id, sender, content, fileUrl, fileType) {
      // 履歴メッセージは俺(shoden)の画面にだけ表示する！
      if (sender === 'system_online_history' && MY_NAME !== 'shoden') return;

      const wrapper = document.createElement('div');
      
      // 俺自身からのメッセージ、もしくはシステム履歴の場合は右側に表示
      const isOwnOrSystem = (sender === MY_NAME || sender === 'system_online_history');
      wrapper.classList.add('message-wrapper', isOwnOrSystem ? 'my-wrapper' : 'their-wrapper');
      wrapper.id = `msg-${id}`;
      
      const bubble = document.createElement('div');
      let bubbleClass = 'their-message';
      if (sender === MY_NAME) bubbleClass = 'my-message';
      else if (sender === 'system_online_history') bubbleClass = 'system-message';
      
      bubble.classList.add('bubble', bubbleClass);

      if (content) {
        const textSpan = document.createElement('span');
        const parts = content.split(/(https?:\/\/[^\s]+)/g);
        parts.forEach(part => {
          if (part.match(/(https?:\/\/[^\s]+)/g)) {
            const link = document.createElement('a'); link.href = part; link.target = '_blank'; link.textContent = part; textSpan.appendChild(link);
          } else { textSpan.appendChild(document.createTextNode(part)); }
        });
        bubble.appendChild(textSpan);
      }

      if (fileUrl) {
        if (content) bubble.appendChild(document.createElement('br'));
        const type = fileType ? fileType.toLowerCase() : '';
        if (type.startsWith('image/')) {
          const img = document.createElement('img'); img.src = fileUrl; bubble.appendChild(img);
        } else if (type.startsWith('video/')) {
          const video = document.createElement('video'); video.src = fileUrl; video.controls = true; video.playsInline = true; bubble.appendChild(video);
        } else {
          const link = document.createElement('a'); link.href = fileUrl; link.target = '_blank'; link.textContent = '📁 ファイルを開く'; bubble.appendChild(link);
        }
      }

      const deleteBtn = document.createElement('button');
      deleteBtn.classList.add('delete-btn'); deleteBtn.textContent = '🗑️';
      deleteBtn.onclick = async () => { if (confirm('削除する？')) await supabaseClient.rpc('delete_message', { msg_id: id }); };
      
      // 削除ボタンは右側メッセージなら左に置く
      if (isOwnOrSystem) { 
        wrapper.appendChild(deleteBtn); wrapper.appendChild(bubble); 
      } else { 
        wrapper.appendChild(bubble); wrapper.appendChild(deleteBtn); 
      }
      chatBox.appendChild(wrapper); chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function loadMessages() {
      const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
      if (data) data.forEach(msg => appendMessage(msg.id, msg.sender, msg.content, msg.file_url, msg.file_type));
    }

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) fileLabel.style.backgroundColor = '#a5d8ff';
      else fileLabel.style.backgroundColor = '#f1f3f5';
    });

    sendBtn.addEventListener('click', async () => {
      const text = messageInput.value; 
      const file = fileInput.files[0];
      
      if (!text.trim() && !file) return;
      
      sendBtn.disabled = true;
      const originalBtnText = sendBtn.textContent;
      sendBtn.textContent = '送信中...';
      const resetBtn = () => { sendBtn.disabled = false; sendBtn.textContent = originalBtnText; };

      try {
        if (file) {
          const fileExt = file.name.split('.').pop() || 'jpg';
          const randomStr = Math.random().toString(36).substring(2, 10);
          const filePath = `${Date.now()}_${randomStr}.${fileExt}`;
          const fileTypeTemp = file.type || 'image/jpeg';

          const reader = new FileReader();
          reader.onload = async (e) => {
            const arrayBuffer = e.target.result;
            const { error: uploadError } = await supabaseClient.storage.from('chat_files').upload(filePath, arrayBuffer, {
              contentType: fileTypeTemp
            });
            if (uploadError) { alert('ストレージエラー💦: ' + uploadError.message); resetBtn(); return; }
            
            const { data } = supabaseClient.storage.from('chat_files').getPublicUrl(filePath);
            const { error: dbError } = await supabaseClient.from('messages').insert([{ 
              sender: MY_NAME, content: text, file_url: data.publicUrl, file_type: fileTypeTemp 
            }]);
            
            if (!dbError) { messageInput.value = ''; fileInput.value = ''; fileLabel.style.backgroundColor = '#f1f3f5'; }
            else { alert('DBエラー💦: ' + dbError.message); }
            resetBtn();
          };
          reader.onerror = () => { alert('ファイルの読み込み失敗💦'); resetBtn(); };
          reader.readAsArrayBuffer(file);
        } else {
          const { error: dbError } = await supabaseClient.from('messages').insert([{ 
            sender: MY_NAME, content: text, file_url: null, file_type: null 
          }]);
          if (!dbError) { messageInput.value = ''; fileInput.value = ''; }
          else { alert('DBエラー💦: ' + dbError.message); }
          resetBtn();
        }
      } catch (err) { alert('予期せぬエラー💦: ' + err.message); resetBtn(); }
    });
  </script>
</body>
</html>
