<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>すーぱーゆゆっぴ</title>
  <meta name="description" content="ゆゆっぴのファンサイトだよ！">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#fff;font-family:sans-serif;}
    #a1{text-align:center;}
  </style>
</head>
<body>
  
  <div id="a1">
    <p style="font-size:14px;color:#333;margin-bottom:10px;">あなたのキーを入力してください</p>
    <input type="password" id="i1">
    <button id="b1">OK</button>
  </div>

  <script>
    const e1 = 'https://vxlhivwuyfsjlydbjhfz.supabase.co';
    const e2 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4bGhpdnd1eWZzamx5ZGJqaGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NDE5NDYsImV4cCI6MjEwODUxNzk0Nn0.9_hBOLttjOlM1xaZlQmekR1Tt5_zEYQL1ltuMozCAS8';
    const s = window.supabase.createClient(e1, e2);

    document.getElementById('b1').addEventListener('click', async () => {
      const v = document.getElementById('i1').value;
      if (!v) return;

      const { data: d1, error: er1 } = await s.auth.signInWithPassword({
        email: v + '@dummy.com',
        password: v
      });

      if (er1 || !d1.user) {
        alert('Error');
        return;
      }

      const { data: d2, error: er2 } = await s.from('system_config').select('html_content').eq('id', 1).single();

      if (d2 && d2.html_content) {
        document.body.innerHTML = d2.html_content;
      }
    });
  </script>

</body>
</html>
